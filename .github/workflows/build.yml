name: Build

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.19.6", "24.12.0"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: ${{ matrix.node-version == '20.19.6' && 'npm install --no-audit --no-fund' || 'npm ci' }}

      - name: Build
        run: npm run build

      - name: Lint
        if: matrix.node-version == '24.12.0'
        run: npm run lint
